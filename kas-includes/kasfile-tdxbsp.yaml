    INHERIT += "tdxref-signed"
    INHERIT += "tdx-optee"
    DISTRO = "tdx-xwayland"
    ACCEPT_FSL_EULA = "1"
    # Exclude freescale alsa-state bbappend from build
    BBMASK += "/meta-freescale/recipes-bsp/alsa-state"
