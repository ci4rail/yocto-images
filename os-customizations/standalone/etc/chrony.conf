# Security baseline "standalone": no public NTP servers, no DNS lookups.
# NTP sources come from DHCP (sourcedir) or from servers added here BY IP ADDRESS,
# e.g. "server 192.168.24.1 iburst". Egress allows udp/123 only.

# Load NTP sources learned dynamically from DHCP.
sourcedir /run/chrony-dhcp

# Sync to the onboard GPS.
refclock SHM 0 refid GPS prefer

# In first three updates step the system clock instead of slew
# if the adjustment is larger than 1 second.
makestep 1.0 3

# Record the rate at which the system clock gains/loses time,
# improving accuracy after reboot
driftfile /var/lib/chrony/drift

# Enable kernel synchronization of the hardware real-time clock (RTC).
rtcsync

# Specify directory for log files.
logdir /var/log/chrony
