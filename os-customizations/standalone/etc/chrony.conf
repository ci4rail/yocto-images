# Security baseline "standalone": no public NTP servers.
# NTP sources come from DHCP (sourcedir) or from servers added here,
# e.g. "server 192.168.24.1 iburst". Egress allows udp/123 (NTP) and port 53 (DNS).

# Load NTP sources learned dynamically from DHCP.
sourcedir /run/chrony-dhcp

# Sync to the onboard GPS (gpsd, NMEA, no PPS). NMEA lags by ~330 ms: offset
# compensates it and delay widens the error bound, so GPS and a DHCP NTP server
# agree instead of both being rejected as falsetickers. Without NTP, GPS is used alone.
refclock SHM 0 refid GPS offset 0.33 delay 0.2

# In first three updates step the system clock instead of slew
# if the adjustment is larger than 1 second.
makestep 1.0 3

# Record the rate at which the system clock gains/loses time,
# improving accuracy after reboot
driftfile /var/lib/chrony/drift

# Enable kernel synchronization of the hardware real-time clock (RTC).
rtcsync

# Specify directory for log files.
logdir /var/log/chrony
