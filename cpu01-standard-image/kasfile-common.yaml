header:
  version: 11
  includes:
    - ../kas-includes/kasfile-general.yaml
    - ../kas-includes/kasfile-tdxbsp.yaml
    - ../kas-includes/kasfile-mender.yaml
    - ../kas-includes/kasfile-mender-tdxbsp.yaml
    - ../kas-includes/kasfile-docker.yaml

# The machine as it is written into the `local.conf` of bitbake.
machine: moducop-cpu01
# The distro name as it is written into the `local.conf` of bitbake.
distro: tdx-xwayland
# The target that is built by bitbake
target: ci4rail-base-image

local_conf_header:
  ci4rail-image-metadata: |
    SUMMARY:pn-ci4rail-base-image = "Ci4Rail ModuCop CPU01 Standard (Non-Secure Boot)"
    DESCRIPTION:pn-ci4rail-base-image = "Linux image with Mender OTA updates"
  persistent-logging: |
    VOLATILE_LOG_DIR = "no"
    IMAGE_INSTALL:append = " persistent-logging"
  root-login: |
    INHERIT += "extrausers"
    # encrypted "cheesebread"
    ROOT_PASSWD = "\$5\$.x/PBHo0ZCIQUgJU\$oArWPZxXmMSwJzQHZax8zh5INbh33dvfW2zWdx1dK83"
    EXTRA_USERS_PARAMS = "usermod -p '${ROOT_PASSWD}' root; "
  src/meta-custom: |
    # Prefix to the resulting deployable tarball name
    BASENAME = "Standard-Image-Non-Secure-Boot"
