header:
  version: 11
  includes:
    - ./kasfile-common.yaml

repos:
  # ci4rail
  src/meta-akv-signing:
    url: https://github.com/ci4rail/meta-akv-signing.git
    branch: scarthgap

local_conf_header:
  src/meta-custom: |
    # Prefix to the resulting deployable tarball name
    BASENAME = "Standard-Image-Production"
    INHERIT += "tdxref-signed"
    TDX_IMX_HAB_CST_BUILD_FROM_SOURCE = "1"
    DM_VERITY_IMAGE = "ci4rail-base-image"
    # TDX_IMX_HAB_CST_KEY_SIZE = "3072"
    # TDX_IMX_HAB_CST_DIR = "/work/secure-boot-material/staging"
    # UBOOT_SIGN_KEYDIR = "/work/secure-boot-material/staging/keys/fit"
    AKV_SIGNING_ENABLE = "1"
    BB_ENV_PASSTHROUGH_ADDITIONS:append = " AZURE_APP_ID AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_FEDERATED_TOKEN_FILE AZURE_AUTHORITY_HOST"
    FIT_SIGN_ALG = "rsa3072"
    FIT_SIGN_NUMBITS = "3072"
    UBOOT_FIT_SIGN_ALG = "rsa3072"
    UBOOT_FIT_SIGN_NUMBITS = "3072"
    AZURE_FIT_KEY_ID = "https://vault-firmware-signing.vault.azure.net/keys/moducop-cpu01-fit"
    AKV_HAB_CSF_KEY_ID = "https://vault-firmware-signing.vault.azure.net/keys/moducop-cpu01-csf-1-1"
    AKV_HAB_IMG_KEY_ID = "https://vault-firmware-signing.vault.azure.net/keys/moducop-cpu01-img-1-1"
    AKV_HAB_SRK_CERT_FILES = "\
      /work/secure-boot-material/production/crts/SRK1_sha256_3072_65537_v3_ca_crt.pem \
      /work/secure-boot-material/production/crts/SRK2_sha256_3072_65537_v3_ca_crt.pem \
      /work/secure-boot-material/production/crts/SRK3_sha256_3072_65537_v3_ca_crt.pem \
      /work/secure-boot-material/production/crts/SRK4_sha256_3072_65537_v3_ca_crt.pem \
    "


env:
  AZURE_APP_ID: ""
  AZURE_CLIENT_ID: ""
  AZURE_TENANT_ID: ""
  AZURE_SUBSCRIPTION_ID: ""
  AZURE_FEDERATED_TOKEN_FILE: ""
  AZURE_AUTHORITY_HOST: "https://login.microsoftonline.com"
