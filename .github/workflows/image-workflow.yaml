# Worflow to build and test images
name: "build and test yocto image"

on:
  workflow_call:
    inputs:
      machine:
        description: "e.g. cpu01"
        required: true
        type: string
      som_type:
        description: "verdin-imx8mm or verdin-imx8mp"
        required: false
        type: string
        default: "verdin-imx8mm"
      machine_dir:
        description: "e.g. moducop-cpu01"
        required: true
        type: string
      image_type:
        description: "e.g. standard"
        required: true
        type: string
      image_start:
        description: "e.g. Moducop-CPU01_Standard-Image"
        required: true
        type: string
      output_type:
        description: "Image output type: tar|sdimg"
        required: false
        type: string
        default: "tar"
      have_mender:
        description: "Whether a mender artefact will be created: true|false"
        required: false
        type: string
        default: "true"
      tar_ending:
        description: "tar filename ending before .tar: .mender_tezi|-ci4rail_tezi"
        required: false
        type: string
        default: ".mender_tezi"
      docker_username:
        required: false
        type: string
        default: "ci4rail"
      docker_registry:
        required: false
        type: string
        default: ""
      test_name:
        required: true
        type: string
      test_station:
        description: "Name:Port of MQTT broker on test station"
        required: false
        type: string
        default: "lizard-rpi:1883"
      test_station_topic:
        description: "MQTT master topic of the test-scheduler (requests go to <topic>/request)"
        required: false
        type: string
        default: "teststation"
      test_station_request_timeout:
        description: "Seconds to wait for a busy test station to become available"
        required: false
        type: string
        default: "3600"
      requester_version:
        description: "Release tag of ci4rail/test-scheduler providing test-requester"
        required: false
        type: string
        default: "v4.7.0"
      simulate_build:
        description: "Simulate build for testing purposes"
        required: false
        type: string
        default: "false"
      staging_kasfile:
        description: "kas file for the secure boot staging image tested on the testfarm"
        required: false
        type: string
        default: "kasfile-sb-staging.yaml"
      station_config:
        description: "Testfarm station config inside the pytest package (e.g. config/station-ci-cpu01.yaml). Empty: no hardware tests"
        required: false
        type: string
        default: ""

    secrets:
      docker_password:
        required: true
      mender_tenant_token:
        required: true
      minio_access_key:
        required: true
      minio_secret_key:
        required: true
      mender_user_email:
        required: true
      mender_password:
        required: true
      private_token:
        required: true
      tailscale_auth_key:
        required: true

permissions:
  contents: read
  id-token: write

env:
  BUILDER_IMAGE: ghcr.io/siemens/kas/kas:4.7
  MENDER_CLI_IMAGE: ci4rail/mender-cli:master-2021-03-08
  MENDER_SERVER_URL: https://hosted.mender.io
  TESTSTATION_MQTT_URL: ${{ inputs.test_station }}
  CACHE_LOCKFILE: /yocto-cache/lock
  IMAGE_DIR: ${{ inputs.machine }}-${{ inputs.image_type }}-image

jobs:
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.getversion.outputs.version }}
      name_suffix: ${{ steps.eventCheck.outputs.name_suffix }}
      mender_tezi_file_name: ${{ steps.eventCheck.outputs.mender_tezi_file_name }}
      mender_file_name: ${{ steps.eventCheck.outputs.mender_file_name }}
      sbom_file_name: ${{ steps.eventCheck.outputs.sbom_file_name }}
      image_folder: ${{ steps.eventCheck.outputs.image_folder }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine Version
        id: getversion
        run: |
          scripts/layer-revparse.sh ${IMAGE_DIR}/src ${IMAGE_DIR}/layer-revs
          image_version=$(scripts/gen-image-version.sh . ${IMAGE_DIR}/layer-revs)
          echo "version=${image_version}" >> $GITHUB_OUTPUT
      - name: Generate Image name dependend on github event
        id: eventCheck
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          name_suffix=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PR event
            name_suffix="-pr"
          fi
          echo "name_suffix=$name_suffix" >> $GITHUB_OUTPUT
          echo "mender_tezi_file_name=${{ inputs.image_start }}_${{ steps.getversion.outputs.version }}${name_suffix}${{ inputs.tar_ending }}.tar" >> $GITHUB_OUTPUT
          echo "mender_file_name=${{ inputs.image_start }}_${{ steps.getversion.outputs.version }}${name_suffix}.mender" >> $GITHUB_OUTPUT
          echo "sbom_file_name=${{ inputs.image_start }}_${{ steps.getversion.outputs.version }}${name_suffix}.spdx.tar.zst" >> $GITHUB_OUTPUT
          echo "image_folder=install/images/${{ inputs.machine_dir }}" >> $GITHUB_OUTPUT

  dumpversions:
    name: "Dump"
    runs-on: ubuntu-latest
    needs: calculate-version

    steps:
      - name: "Dump"
        run: |
          echo "image version is ${{ needs.calculate-version.outputs.version }}"
          echo "name suffix is ${{ needs.calculate-version.outputs.name_suffix }}"
          echo "mender tezi file name is ${{ needs.calculate-version.outputs.mender_tezi_file_name }}"
          echo "mender file name is ${{ needs.calculate-version.outputs.mender_file_name }}"
          echo "sbom file name is ${{ needs.calculate-version.outputs.sbom_file_name }}"
          echo "image folder is ${{ needs.calculate-version.outputs.image_folder }}"

