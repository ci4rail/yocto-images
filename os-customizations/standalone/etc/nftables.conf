#!/usr/sbin/nft -f
#
# Security baseline "standalone" (closed device, no internet).
#
# Ingress: ssh (22), https (443, served by the customer container), snmpv3 (161)
#          and ICMP / ICMPv6.
# Egress:  DHCP client, NTP client, ICMP, and replies to the services above.
#          No DNS: configure NTP servers by IP address (or extend the output chain).
# Forwarded (container) traffic is not filtered here; docker manages its own chains.
#
add table inet ci4rail_fw
delete table inet ci4rail_fw

table inet ci4rail_fw {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept
        # container -> host (e.g. core api)
        iifname "docker0" accept
        iifname "br-*" accept

        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept
        udp sport 67 udp dport 68 accept

        tcp dport { 22, 443 } accept
        udp dport 161 accept
    }

    chain output {
        type filter hook output priority filter; policy drop;

        ct state established,related accept
        oifname "lo" accept
        oifname "docker0" accept
        oifname "br-*" accept

        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept
        udp sport 68 udp dport 67 accept
        udp dport 123 accept
    }
}
