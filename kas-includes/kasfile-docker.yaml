header:
  version: 11
repos:
  # docker
  src/meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    commit: 3dd635f613f7299d986a8ab6bc9f584370f8ed1d

local_conf_header:
  src/meta-ci4rail-docker: |
    DISTRO_FEATURES:append = " virtualization"
    BBFILE_PRIORITY_openembedded-layer = "4"

    IMAGE_INSTALL:append = " docker-moby \
                  docker-compose \
                  conmon \
                  ca-certificates \
                  aardvark-dns \
                  netavark \
                  "
