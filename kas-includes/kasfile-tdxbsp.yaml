local_conf_header:
  src/meta-ci4rail-tdxbsp: |
    INHERIT += "toradex-mirrors"
    DISTRO = "tdx-xwayland"
    ACCEPT_FSL_EULA = "1"
    # Exclude freescale alsa-state bbappend from build
    BBMASK += "/meta-freescale/recipes-bsp/alsa-state"
    # The unused mainline recipe resolves AUTOREV over the network during parsing.
    # Use the versioned Toradex U-Boot recipe for reproducible builds.
    BBMASK += "/u-boot-toradex_mainline\.bb$"
