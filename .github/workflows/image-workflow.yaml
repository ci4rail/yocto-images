  build-staging-image:
    # Secure boot image with dummy (staging) signatures: the only image the closed
    # testfarm targets boot. Built on every run that has hardware tests.
    if: inputs.station_config != '' && inputs.simulate_build == 'false'
    needs: calculate-version
    name: Build Secure Staging Image
    runs-on: [self-hosted, linux, x64, yocto-runner]
    steps:
      - uses: actions/checkout@v6

      - name: Log into Docker
        env:
          DOCKER_PASSWORD: ${{ secrets.docker_password }}
        run: echo ${DOCKER_PASSWORD} | docker login ${{ inputs.docker_registry }} -u ${{ inputs.docker_username }} --password-stdin

      - name: Create Folders for Yocto Build
        run: |
          mkdir -p ~/install ~/sstate-cache ~/downloads
          rm -rf ~/install/*

      - name: Install Rsync for Yocto-Cache Handling
        if: github.event_name == 'pull_request'
        run: sudo apt-get update -y && sudo apt-get install -y rsync

      - name: Get Cache for Yocto Builds
        if: github.event_name == 'pull_request'
        run: |
          while true; do
            if ( set -o noclobber; echo "$$" > "${{ env.CACHE_LOCKFILE }}") 2> /dev/null; then
              trap 'rm -f "${{ env.CACHE_LOCKFILE }}"; exit $?' INT TERM EXIT
              echo "cache lock obtained by $$. get cache"
              rsync -rht --ignore-missing-args /yocto-cache/downloads/* ~/downloads/
              rsync -rht --ignore-missing-args /yocto-cache/sstate-cache/* ~/sstate-cache/
              rm -f "${{ env.CACHE_LOCKFILE }}"
              echo cache lock cleared
              trap - INT TERM EXIT
              break
            else
              echo "Cache is locked. Wait"
              sleep 60
            fi
          done

      - name: Build Secure Staging Yocto
        env:
          MENDER_ARTIFACT_NAME: ${{ inputs.machine }}-${{ inputs.image_type }}-${{ needs.calculate-version.outputs.version }}${{ needs.calculate-version.outputs.name_suffix }}-secure-staging
        run: |
          docker run \
                -v ~/install:/install \
                -v ~/sstate-cache:/sstate-cache \
                -v ~/downloads:/downloads \
                -v ${GITHUB_WORKSPACE}/${IMAGE_DIR}:/work \
                -v ${GITHUB_WORKSPACE}/kas-includes:/kas-includes \
                -v ${GITHUB_WORKSPACE}/ota-signing-material:/ota-signing-material:ro \
                -u $(id -u):$(id -g) \
                -e MENDER_SERVER_URL=${MENDER_SERVER_URL} \
                -e MENDER_TENANT_TOKEN=${{ secrets.mender_tenant_token }} \
                -e IMAGE_NAME_SUFFIX=${{ needs.calculate-version.outputs.name_suffix }} \
                -e IMAGE_GIT_VERSION=${{ needs.calculate-version.outputs.version }} \
                -e MENDER_ARTIFACT_NAME=${MENDER_ARTIFACT_NAME} \
                -e GITCONFIG_FILE=/kas-includes/gitconfig \
                -w /work \
                ${BUILDER_IMAGE} \
                build ${{ inputs.staging_kasfile }}

      - name: Store Cache for Yocto Builds
        if: github.event_name == 'pull_request'
        run: |
          while true; do
            if ( set -o noclobber; echo "$$" > "${{ env.CACHE_LOCKFILE }}") 2> /dev/null; then
              trap 'rm -f "${{ env.CACHE_LOCKFILE }}"; exit $?' INT TERM EXIT
              echo "cache lock obtained. write back cache"
              rsync -rht ~/downloads/* /yocto-cache/downloads/
              rsync -rht ~/sstate-cache/* /yocto-cache/sstate-cache/
              rm -f "${{ env.CACHE_LOCKFILE }}"
              trap - INT TERM EXIT
              break
            else
              echo "Cache is locked. Wait"
              sleep 60
            fi
          done

      - name: Upload staging build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: staging-build-artifacts-${{ inputs.machine }}-${{ github.run_id }}
          path: |
            ~/${{ needs.calculate-version.outputs.image_folder }}/*.mender
            ~/${{ needs.calculate-version.outputs.image_folder }}/*.tar
            !~/${{ needs.calculate-version.outputs.image_folder }}/Standard-Image-*
          if-no-files-found: error

  test-staging:
    # Runs on a GitHub-hosted runner. The test bundle (pytest suite + staging image) is uploaded
    # as an artifact; the test-scheduler on the test computer (TC) downloads and runs it
    # (tests/scripts/test-script.sh). The runner reaches the test station's MQTT broker via tailscale.
    # Fork PRs never get access to the hardware.
    if: >-
      inputs.station_config != '' && inputs.simulate_build == 'false' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [build-staging-image]
    name: Test staging image on testfarm (${{ inputs.machine }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: staging-build-artifacts-${{ inputs.machine }}-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-image

      - name: Assemble test bundle
        run: |
          # The build emits the versioned TEZI tar plus an unversioned "Standard-Image-Staging-*" duplicate; use the versioned one.
          images=("${RUNNER_TEMP}"/staging-image/${{ inputs.image_start }}*tezi*.tar)
          test "${#images[@]}" -eq 1 || { echo "Expected exactly one TEZI tar, found: ${images[*]}"; exit 1; }
          bundle="${RUNNER_TEMP}/test-bundle"
          mkdir -p "${bundle}"
          tests/scripts/package.sh "${bundle}/yocto-pytest-package.tar.gz"
          # The rootfs inside is uncompressed (~1.4 GB): zstd shrinks the bundle ~5x, speeding up the TC download.
          zstd -T0 -10 -q -o "${bundle}/image.tezi.tar.zst" "${images[0]}"
          cp tests/scripts/test-script.sh "${bundle}/test-script.sh"
          chmod +x "${bundle}/test-script.sh"
          {
            echo "STATION_CONFIG=${{ inputs.station_config }}"
            echo "IMAGE_FILE=image.tezi.tar.zst"
          } > "${bundle}/bundle.env"

      - name: Upload test bundle
        id: bundle
        uses: actions/upload-artifact@v7
        with:
          name: test-bundle-${{ inputs.machine }}-${{ github.run_id }}
          path: ${{ runner.temp }}/test-bundle
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Fetch test requester
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: "ci4rail/test-scheduler"
          version: "tags/${{ inputs.requester_version }}"
          file: "test-requester-${{ inputs.requester_version }}-linux-amd64.tar.gz"
          token: ${{ secrets.private_token }}

      - name: Connect to test station via tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.tailscale_auth_key }}

      - name: Request test on test station
        env:
          ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
          ARTIFACT_NAME: test-bundle-${{ inputs.machine }}-${{ github.run_id }}
        run: |
          tar xzf "test-requester-${{ inputs.requester_version }}-linux-amd64.tar.gz" test-requester
          chmod +x test-requester
          jq -n \
            --arg user "github-${{ github.repository }}-${{ github.run_id }}" \
            --arg owner "${{ github.repository_owner }}" \
            --arg repo "${{ github.event.repository.name }}" \
            --argjson id "${ARTIFACT_ID}" \
            --arg name "${ARTIFACT_NAME}" \
            --arg rev "${{ github.sha }}" \
            '{type: "Run Test", user: $user, github_artifact: {owner: $owner, repo: $repo, artifact_id: $id, name: $name, revision: $rev}}' \
            > request.json
          cat request.json

          set +e
          set -o pipefail
          ./test-requester -busytimeout "${{ inputs.test_station_request_timeout }}" \
            "${TESTSTATION_MQTT_URL}" "${{ inputs.test_station_topic }}" request.json | tee output.txt
          rc=$?
          set -e

          case $rc in
            0) echo "Test PASS" ;;
            1) echo "ERROR Test Failed" ;;
            2) echo "ERROR Test Station Busy" ;;
            3) echo "ERROR Request Invalid" ;;
            *) echo "ERROR requester exit code $rc" ;;
          esac
          {
            echo "### Testfarm result (${{ inputs.machine }}): exit code $rc"
            echo '```'
            cat output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

