#!/usr/sbin/nft -f
#
# Security baseline "standalone" (closed device, no internet).
#
# Ingress: ssh (22), https (443, served by the customer container), snmpv3 (161)
#          and ICMP / ICMPv6.
# Egress:  DHCP client, DNS client, NTP client, ICMP, and replies to the services above.
# io4edge: the USB network links to the io4edge modules inside the device
#          (usb_io_ctrl, usb_ext1..8, 192.168.200.0/21 and 192.168.208.0/24, set up by
#          usb-netif-setup.sh) are internal and open in both directions: the CPU serves
#          DHCP to the modules (dnsmasq), finds them via mDNS (avahi, only on these links)
#          and talks to them over TCP (io4edge-cli, core API firmware updates, containers).
# Forwarded (container) traffic is not filtered here; docker manages its own chains.
#
add table inet ci4rail_fw
delete table inet ci4rail_fw

table inet ci4rail_fw {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept
        # container -> host (e.g. core api)
        iifname "docker0" accept
        iifname "br-*" accept
        # internal io4edge links
        iifname "usb_io_ctrl" accept
        iifname "usb_ext*" accept

        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept
        udp sport 67 udp dport 68 accept

        tcp dport { 22, 443 } accept
        udp dport 161 accept
    }

    chain output {
        type filter hook output priority filter; policy drop;

        ct state established,related accept
        oifname "lo" accept
        oifname "docker0" accept
        oifname "br-*" accept
        # internal io4edge links
        oifname "usb_io_ctrl" accept
        oifname "usb_ext*" accept

        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept
        udp sport 68 udp dport 67 accept
        udp dport 53 accept
        tcp dport 53 accept
        udp dport 123 accept
    }
}
