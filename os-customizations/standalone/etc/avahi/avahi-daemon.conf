# Standalone profile: avahi only serves the internal io4edge links. io4edge-cli and
# the core API find and resolve the io4edge modules through avahi (mDNS). Nothing is
# published, and end0, eth2, wlan and the modem see no mDNS traffic.
# Interface names: usb-netif-setup.sh in meta-ci4rail-bsp.
[server]
use-ipv4=yes
use-ipv6=yes
allow-interfaces=usb_io_ctrl,usb_ext1,usb_ext2,usb_ext3,usb_ext4,usb_ext5,usb_ext6,usb_ext7,usb_ext8
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
disable-publishing=yes
publish-hinfo=no
publish-workstation=no

[reflector]
enable-reflector=no

[rlimits]
