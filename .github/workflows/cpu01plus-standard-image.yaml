name: CPU01Plus Standard Image
on:
  pull_request:
    branches:
      - scarthgap-secure-boot
    paths:
      - "cpu01plus-standard-image/kasfile-common.yaml"
      - "cpu01plus-standard-image/kasfile-nonsecure.yaml"
      - "cpu01plus-standard-image/kasfile-sb-production.yaml"
      - "cpu01plus-standard-image/kasfile-sb-staging.yaml"
      - "kas-includes/kasfile-ota-protection.yaml"
      - "os-customizations/**"
      - "ota-signing-material/staging/**"
      - "ota-signing-material/production/**"
      - "secure-boot-material/**"
      - "tests/**"
      - "kas-includes/kasfile-tdxbsp.yaml"
      - "kas-includes/kasfile-mender.yaml"
      - "kas-includes/kasfile-mender-tdxbsp.yaml"
      - "kas-includes/kasfile-general.yaml"
      - ".github/workflows/cpu01plus-standard-image.yaml"
      - ".github/workflows/image-workflow.yaml"
      - ".github/actions/**"
      - "scripts/ci-*.sh"
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  workflow-call:
    uses: ./.github/workflows/image-workflow.yaml
    with:
      machine: "cpu01plus"
      som_type: "verdin-imx8mp"
      machine_dir: "moducop-cpu01plus"
      image_type: "standard"
      output_type: "tar"
      image_start: "Moducop-CPU01Plus_Standard-Image"
      test_name: "cpu01plus-standard-image test"
      station_config: "config/station-ci-cpu01plus.yaml"
      test_station: "hydra-rpi:1883"
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      mender_tenant_token: ${{ secrets.MENDER_TENANT_TOKEN }}
      mender_user_email: ${{ secrets.MENDER_USER_EMAIL }}
      mender_password: ${{ secrets.MENDER_PASSWORD }}
      private_token: ${{ secrets.FW_CI_TOKEN }}
      tailscale_auth_key: ${{ secrets.YODA_TAILSCALE_AUTHKEY }}
