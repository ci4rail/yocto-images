# Static fallback address of end0, used only while DHCP has no lease.
# CIDR notation. Must not overlap with the networks of the other interfaces.
FALLBACK_ADDRESS=192.168.250.1/24
# Optional default gateway while the fallback address is used; empty for none.
FALLBACK_GATEWAY=
# Seconds without a DHCP lease before the fallback address is added.
FALLBACK_TIMEOUT=30
