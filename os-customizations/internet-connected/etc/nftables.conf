#!/usr/sbin/nft -f
#
# Security baseline "internet-connected" (vehicle installation).
#
# Egress: open (mender-server, tailscale, other internet services).
# Ingress: closed, except
#   - ssh from the LAN and from tailscale0
#   - ICMP / ICMPv6
#   - DHCPv4 replies
# Adapt the LAN prefix to the site. Forwarded (container) traffic is not
# filtered here; docker manages its own chains.
#
add table inet ci4rail_fw
delete table inet ci4rail_fw

table inet ci4rail_fw {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept
        # container -> host (e.g. core api)
        iifname "docker0" accept
        iifname "br-*" accept

        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept
        udp sport 67 udp dport 68 accept

        iifname "tailscale0" tcp dport 22 accept
        ip saddr 192.168.24.0/24 tcp dport 22 accept
    }
}
