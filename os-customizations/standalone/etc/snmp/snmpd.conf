# Security baseline "standalone": SNMPv3 only, authenticated and encrypted.
#
# EXAMPLE credentials for testing. Replace user and passphrases per customer.
# createUser is consumed at first start: snmpd stores the localized keys in
# /var/lib/net-snmp (persistent) and does not re-read changed passphrases for
# an existing user. Delete /data/net-snmp/snmpd.conf to re-create users.
createUser ci4rail-example SHA "example-auth-passphrase" AES "example-priv-passphrase"
rouser ci4rail-example priv

# No v1/v2c communities (no com2sec/rocommunity lines): v1/v2c are rejected.
agentaddress udp:161
sysLocation "ModuCop"
sysContact "support@ci4rail.com"
