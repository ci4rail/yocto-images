# Customer profile: closed standalone device, no internet.
# Ingress: ssh, https (customer container), snmpv3. Egress: DHCP, DNS and NTP client.
# SSH only as moducop or ci4rail with a key, sudo with password, no serial console login.
# The matching customization is os-customizations/standalone.
name: standalone
customization: standalone
customer_container: true
services_active: [snmpd, ci4rail-end0-fallback]
services_inactive: [tailscaled, avahi-daemon, snmptrapd, mender-updated, mender-authd, mender-connect]
# The only SSH login the customization leaves. The tests use it while the profile is
# installed. Must match etc/ssh/authorized_keys/moducop and the hash in
# etc/ci4rail/user-passwords/moducop of the customization. TEST credentials only.
ssh_access:
  username: moducop
  key_file: standalone-moducop-test.key  # relative to this directory
  sudo_password: example-moducop-password
# Further key users of the customization, with the same rights as ssh_access.
# Checked by the tests but not used as harness login. TEST credentials only.
extra_ssh_users:
  - username: ci4rail
    key_file: standalone-ci4rail-test.key
    sudo_password: example-ci4rail-password
# end0 uses DHCP and, while no lease is available, a static fallback address.
# Must match etc/ci4rail/end0-fallback/end0-fallback.conf of the customization.
end0_fallback:
  address: 192.168.250.1/24
  timeout: 30
  # Address the TC adds to its interface toward the target to reach the fallback.
  tc_address: 192.168.250.2/24
https:
  port: 443
  marker: ci4rail-profile-https-ok
# Example credentials, must match os-customizations/standalone/etc/snmp/snmpd.conf
snmpv3:
  user: ci4rail-example
  auth_protocol: SHA
  auth_passphrase: example-auth-passphrase
  priv_protocol: AES
  priv_passphrase: example-priv-passphrase
security_baseline:
  allowed_tcp_ports: [22, 443]
  allowed_udp_ports: [161]
  allowed_root_network_processes: [sshd, dropbear, systemd, snmpd, nginx]
  egress_monitor:
    observation_seconds: 15
    allowed_ipv4_cidrs:
      - 192.168.24.0/24     # LAN: replies to ssh/https/snmp clients, local NTP server. TODO: adapt
      - 255.255.255.255/32  # DHCP discover
      - 224.0.0.0/4
    allowed_ipv6_cidrs:
      - fe80::/10
      - ff00::/8
    allowed_tcp_dports: [53]           # DNS client
    allowed_udp_dports: [53, 67, 123]  # DNS client, DHCP client, NTP client
    allowed_udp_sports: []
  abuse_test:
    tcp_ports: [22, 443]
    udp_ports: [161]
