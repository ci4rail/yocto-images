header:
  version: 11

repos:
  # bitbake 2.8 head of 2026-05-13
  src/bitbake:
    url: "https://github.com/openembedded/bitbake.git"
    commit: 82abbfcdbda949851a03bb2cb2049ea689564ad6
    layers:
      # bitbake is no layer. Exclude it from bblayers.conf
      bitbake: "no"

  # From https://git.toradex.com/cgit/toradex-manifest.git/tree/base/pinned.xml?h=7.6.0
  src/meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    commit: 06f846a325fde423bb0a6d49d771d8c1e144d7eb
    layers:
      meta-oe:
      meta-networking:
      meta-filesystems:
      meta-python:
      meta-multimedia:
      meta-gnome:

bblayers_conf_header:
  src/meta-general: |
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  src/meta-ci4rail-general: |
    DL_DIR ?= "/downloads"
    SSTATE_DIR ?= "/sstate-cache"
    DEPLOY_DIR = "/install"
    PACKAGE_CLASSES ?= "package_ipk"
    #USER_CLASSES ?= "buildstats image-mklibs image-prelink"
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
    INHERIT += "rm_work"
    # INHERIT += "cve-check"
    # include conf/distro/include/cve-extra-exclusions.inc
    # SPDX_INCLUDE_COMPILED_SOURCES:pn-linux-toradex = "1"
    DISTRO_FEATURES:append = " systemd"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES_BACKFILL_CONSIDERED = "sysvinit"
    VIRTUAL-RUNTIME_initscripts = ""

env:
  IMAGE_NAME_SUFFIX: ""
  IMAGE_GIT_VERSION: "NoVersion"
